name: Pre-Check Guard
on: [push]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block broken wrangler config
        run: |
          if [ -f wrangler.toml ] || [ -d functions ]; then
            git config user.name "AutoGuard"
            git config user.email "guard@sinazarghami.ir"
            git rm -rf --ignore-unmatch wrangler.toml functions
            git commit -m "chore: auto-remove broken cloudflare worker files"
            git push
          fi
