    <!-- اگر فایل جاوااسکریپت نسخه‌ی جدید به هر دلیلی بارگذاری نشد (مثلاً کش
         لبه‌ی کلادفلر هنوز نسخه‌ی قبلی را داشت)، یک بار با آدرس تازه دوباره
         تلاش می‌کنیم تا کاربر صفحه‌ی سفید نبیند. -->
    <script>
      (function () {
        var RETRY_KEY = 'sina_asset_retry_at';
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (!target || target.tagName !== 'SCRIPT') return;
            // فقط اسکریپت‌های خود سایت باعث بارگذاری مجدد می‌شوند. اسکریپت‌های شخص ثالث
            // (مثل بیکن آمار کلادفلر) در ایران بلاک می‌شوند و نباید صفحه را رفرش کنند.
            var src = target.src || '';
            if (src && src.indexOf(window.location.origin + '/') !== 0) return;
            try {
              var last = Number(sessionStorage.getItem(RETRY_KEY) || 0);
              if (last && Date.now() - last < 60000) return;
              sessionStorage.setItem(RETRY_KEY, String(Date.now()));
            } catch (error) {
              return;
            }
            var url = new URL(window.location.href);
            url.searchParams.set('v', String(Date.now()));
            window.location.replace(url.toString());
          },
          true,
        );
      })();
    </script>
